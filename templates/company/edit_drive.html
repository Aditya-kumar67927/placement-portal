{% extends 'base.html' %}
{% block title %}Edit Drive{% endblock %}
{% block page_title %}Edit Placement Drive{% endblock %}
{% block topbar_actions %}<a href="{{ url_for('company.drives') }}" class="btn btn-sm btn-light">&larr; Back</a>{% endblock %}
{% block content %}
<div style="max-width:720px;margin:0 auto">
    <div class="card">
        <div class="card-header">Edit Drive — {{ drive.job_title }}</div>
        <div class="card-body">
            <form method="POST">
                <div class="form-group">
                    <label>Job Title <span class="required">*</span></label>
                    <input type="text" name="job_title" value="{{ drive.job_title }}" required>
                </div>
                <div class="form-group">
                    <label>Job Description <span class="required">*</span></label>
                    <textarea name="job_description" rows="4" required>{{ drive.job_description }}</textarea>
                </div>
                <div class="form-row">
                    <div class="form-col-half form-group">
                        <label>Required Skills</label>
                        <input type="text" name="required_skills" value="{{ drive.required_skills or '' }}">
                    </div>
                    <div class="form-col-half form-group">
                        <label>Experience Required</label>
                        <input type="text" name="experience_required" value="{{ drive.experience_required or '' }}">
                    </div>
                    <div class="form-col-half form-group">
                        <label>Salary Range</label>
                        <input type="text" name="salary_range" value="{{ drive.salary_range or '' }}">
                    </div>
                    <div class="form-col-half form-group">
                        <label>Application Deadline</label>
                        <input type="date" name="application_deadline" value="{{ drive.application_deadline.strftime('%Y-%m-%d') if drive.application_deadline else '' }}">
                    </div>
                </div>
                <div class="form-group">
                    <label>Eligibility Criteria</label>
                    <textarea name="eligibility_criteria" rows="2">{{ drive.eligibility_criteria or '' }}</textarea>
                </div>
                <div class="form-actions-right">
                    <a href="{{ url_for('company.drives') }}" class="btn btn-light">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save &amp; Resubmit</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

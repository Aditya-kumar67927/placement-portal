{% extends 'base.html' %}
{% block title %}Company Profile{% endblock %}
{% block page_title %}Company Profile{% endblock %}
{% block content %}
<div style="max-width:720px;margin:0 auto">
    <div class="card">
        <div class="card-header">Edit Company Profile</div>
        <div class="card-body">
            <form method="POST">
                <div class="form-row">
                    <div class="form-col-two-thirds form-group">
                        <label>Company Name <span class="required">*</span></label>
                        <input type="text" name="company_name" value="{{ company.company_name }}" required>
                    </div>
                    <div class="form-col-third form-group">
                        <label>Industry</label>
                        <input type="text" name="industry" value="{{ company.industry or '' }}">
                    </div>
                    <div class="form-col-full form-group">
                        <label>Website</label>
                        <input type="url" name="website" value="{{ company.website or '' }}">
                    </div>
                    <div class="form-col-full form-group">
                        <label>Company Description</label>
                        <textarea name="description" rows="3">{{ company.description or '' }}</textarea>
                    </div>
                </div>
                <div class="section-title">HR Contact</div>
                <div class="form-row">
                    <div class="form-col-third form-group">
                        <label>Name</label>
                        <input type="text" name="hr_contact_name" value="{{ company.hr_contact_name or '' }}">
                    </div>
                    <div class="form-col-third form-group">
                        <label>Email</label>
                        <input type="email" name="hr_contact_email" value="{{ company.hr_contact_email or '' }}">
                    </div>
                    <div class="form-col-third form-group">
                        <label>Phone</label>
                        <input type="tel" name="hr_contact_phone" value="{{ company.hr_contact_phone or '' }}">
                    </div>
                </div>
                <div class="form-actions">
                    <div class="text-muted text-sm">Approval status: <span class="badge badge-{{ company.approval_status }}">{{ company.approval_status | capitalize }}</span></div>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
